name: Update Spotify tracks

on:
  schedule:
    # 毎月 1 日 09:30 JST (00:30 UTC) に先月の Top Tracks を生成(デフォルトブランチでのみ動く)
    - cron: "30 0 1 * *"
  workflow_dispatch:
    inputs:
      source:
        description: "取得元"
        type: choice
        default: playlist
        options: [top, playlist, artist, saved-albums, saved-tracks]
      id:
        description: "playlist / artist の URL か ID"
        required: false
        default: ""
      limit:
        description: "件数 (最大 49、20 でぴったり)"
        required: false
        default: "20"
      label:
        description: "画面の見出し(空なら自動)"
        required: false
        default: ""
      month:
        description: "top のときの月 (YYYY-MM、空なら先月)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spotify-tracks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch from Spotify
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          SOURCE: ${{ github.event.inputs.source || 'top' }}
          ID: ${{ github.event.inputs.id }}
          LIMIT: ${{ github.event.inputs.limit || '20' }}
          LABEL: ${{ github.event.inputs.label }}
          MONTH: ${{ github.event.inputs.month }}
        run: |
          set -- --source "$SOURCE" --limit "$LIMIT"
          [ -n "$ID" ] && set -- "$@" --id "$ID"
          [ -n "$LABEL" ] && set -- "$@" --label "$LABEL"
          [ -n "$MONTH" ] && set -- "$@" --month "$MONTH"
          node scripts/fetch-tracks.mjs "$@"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "chore(spotify-tracks): update data ($SOURCE)"
          git push
        env:
          SOURCE: ${{ github.event.inputs.source || 'top' }}
