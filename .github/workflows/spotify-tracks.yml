name: Update Spotify tracks

on:
  schedule:
    # 毎週月曜 09:30 JST (00:30 UTC) に「今ポピュラーな曲」を更新(デフォルトブランチでのみ動く)
    - cron: "30 0 * * 1"
  workflow_dispatch:
    inputs:
      source:
        description: "取得元"
        type: choice
        default: popular
        options: [popular, playlist, artist, top, saved-albums, saved-tracks]
      genres:
        description: "popular のジャンル一覧(カンマ区切り、この順にページが並ぶ。空なら総合 1 ページ)"
        required: false
        default: "jpop,kpop"
      query:
        description: "popular の検索条件(genres が空のときだけ使う)"
        required: false
        default: ""
      id:
        description: "playlist / artist の URL か ID"
        required: false
        default: ""
      limit:
        description: "件数 (既定 40、最大 49)"
        required: false
        default: "40"
      label:
        description: "画面の見出し(空なら自動)"
        required: false
        default: ""
      month:
        description: "top のときの月 (YYYY-MM、空なら先月)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spotify-tracks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch from Spotify
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          SOURCE: ${{ github.event.inputs.source || 'popular' }}
          GENRES: ${{ github.event.inputs.genres || 'jpop,kpop' }}
          QUERY: ${{ github.event.inputs.query }}
          ID: ${{ github.event.inputs.id }}
          LIMIT: ${{ github.event.inputs.limit || '40' }}
          LABEL: ${{ github.event.inputs.label }}
          MONTH: ${{ github.event.inputs.month }}
        run: |
          if [ "$SOURCE" = "popular" ] && [ -n "$GENRES" ]; then
            # ジャンルごとに 1 ページ。並び順は GENRES の順。
            # 1 つのジャンルが 0 件でも他のジャンルは書き出す(失敗したジャンルは最後にまとめて報告)
            i=1
            failed=""
            for g in $(echo "$GENRES" | tr ',' ' '); do
              if ! node scripts/fetch-tracks.mjs --source popular --genre "$g" --order "$i" --limit "$LIMIT"; then
                failed="$failed $g"
              fi
              i=$((i + 1))
            done
            if [ -n "$failed" ]; then
              echo "::warning::取得できなかったジャンル:$failed"
            fi
          else
            set -- --source "$SOURCE" --limit "$LIMIT"
            [ -n "$QUERY" ] && set -- "$@" --query "$QUERY"
            [ -n "$ID" ] && set -- "$@" --id "$ID"
            [ -n "$LABEL" ] && set -- "$@" --label "$LABEL"
            [ -n "$MONTH" ] && set -- "$@" --month "$MONTH"
            node scripts/fetch-tracks.mjs "$@"
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "chore(spotify-tracks): update data ($SOURCE)"
          git push
        env:
          SOURCE: ${{ github.event.inputs.source || 'popular' }}
