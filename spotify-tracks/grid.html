<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Tracks (2D)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" />
  <link rel="stylesheet" href="chrome.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-dots" aria-hidden="true"></div>
  <div class="side side--left" aria-hidden="true">TRACKS TRACKS TRACKS TRACKS TRACKS</div>
  <div class="side side--right" aria-hidden="true">TRACKS TRACKS TRACKS TRACKS TRACKS</div>

  <a class="btn fab" href="index.html">3D</a>

  <div class="deck">
    <section class="panel panel--left">
      <h1 class="logo">TRACKS<small>NOW POPULAR</small></h1>
      <div class="win">
        <div class="win__bar">info</div>
        <div class="win__body">
          今ポピュラーな曲のジャケットを貼り集めたコラージュ。タイルにカーソルを合わせると浮き上がり、クリックで Spotify が開きます。
          <p style="margin: 10px 0 0"><a class="btn" href="index.html">3D 版で見る</a></p>
          <p class="attrib">楽曲データとアートワークは <a href="https://open.spotify.com/" target="_blank" rel="noopener">Spotify</a> から取得しています。</p>
        </div>
      </div>
    </section>

    <div class="frame">
      <div class="frame__bar"><span>tracks.exe</span><span class="frame__btns"><span></span><span></span><span></span></span></div>
      <div class="frame__addr"><span>←</span><span>→</span><span class="url">https://tracks/popular</span></div>
      <div class="screen" id="screen">
        <p class="screen__attrib">楽曲データとアートワークは <a href="https://open.spotify.com/" target="_blank" rel="noopener">Spotify</a> から取得しています。</p>
        <p class="screen__caption" id="caption"></p>
      </div>
    </div>

    <section class="panel panel--right">
      <div class="win">
        <div class="win__bar">menu</div>
        <ol class="menu" id="menu-list"></ol>
      </div>
    </section>
  </div>

  <div id="loading" aria-live="polite">LOADING...</div>

  <script type="module" src="grid.js"></script>
</body>
</html>
